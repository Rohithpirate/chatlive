    <style>

        .user-avatar {

        .input-container {
          <div class="input-container">
    <input 
        type="text" 
        id="messageInput"

</div>
            padding: 18px;
            background: white;
            border-top: 1px solid #e5e5e5;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        #messageInput {
            flex: 1;
            padding: 16px 18px;
            border: 2px solid #e5e5e5;
            border-radius: 16px;

            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }
        
        #messageInput:focus {
            border-color: #19c37d;
            box-shadow: 0 0 0 3px rgba(25, 195, 125, 0.2);
        }
        
        #sendButton {
            background: linear-gradient(135deg, #19c37d, #17b171);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(25, 195, 125, 0.3);
        }
        
        #sendButton:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(25, 195, 125, 0.4);
        }
        
        #sendButton:active {
            transform: scale(0.98);
        }
        
        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 15px;
            align-items: center;
        }
        
        .typing-dot {
            width: 8px;

            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
            40% { transform: translateY(-8px); opacity: 1; }
        }
        
        /* Scrollbar styling */
        .chat-area::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-area::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .chat-area::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }
        
        /* Mobile responsive */
        @media (max-width: 480px) {
            .app-container {
                height: 100vh;
                border-radius: 0;
                max-width: 100%;
            }
            
            .text-bubble {
                max-width: 85%;

<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <span>🤖</span>
            ChatGPT Clone
        </div>
        
        <!-- Chat Messages Area -->
        <div class="chat-area" id="chatArea">
            <!-- Messages will appear here -->
        </div>
        
        <!-- Input Area -->
        <div class="input-container">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Message ChatGPT..." 
                autocomplete="off"
            >
            <button id="sendButton">
                ➤
            </button>
        </div>
    </div>

    <script>
        // DOM Elements
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        
        // Chat state
        let isProcessing = false;
        let chatHistory = [];
        
        // Initialize
        window.onload = function() {
            // Load any saved chat history
            loadChatHistory();
            
            // Focus input field
            messageInput.focus();
            
            // Add welcome message after delay
            setTimeout(() => {
                if (chatHistory.length === 0) {
                    addMessage('ai', "Hello! I'm ChatGPT, an AI assistant. How can I help you today?");
                }
            }, 800);
        };
        
        // Load chat history from localStorage
        function loadChatHistory() {
            try {
                const saved = localStorage.getItem('chatHistory');
                if (saved) {
                    chatHistory = JSON.parse(saved);
                    chatHistory.forEach(msg => {
                        displayMessage(msg.role, msg.content, false);
                    });
                }
            } catch (e) {
                console.log("Could not load chat history");
            }
        }
        
        // Save chat to localStorage
        function saveChatHistory() {
            try {
                localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
            } catch (e) {
                console.log("Could not save chat history");
            }
        }
        
        // Display a message in the chat
        function displayMessage(role, content, saveToHistory = true) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}-message`;
            
            const avatar = document.createElement('div');
            avatar.className = `avatar ${role}-avatar`;
            avatar.textContent = role === 'user' ? 'U' : 'AI';
            
            const bubble = document.createElement('div');
            bubble.className = `text-bubble ${role}-bubble`;
            bubble.textContent = content;
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(bubble);
            chatArea.appendChild(messageDiv);
            
            // Save to history if needed
            if (saveToHistory) {
                chatHistory.push({ role, content });
                saveChatHistory();
            }
            
            // Scroll to bottom
            chatArea.scrollTop = chatArea.scrollHeight;
            
            return bubble;
        }
        
        // Show typing indicator
        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai-message';
            typingDiv.id = 'typingIndicator';
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar ai-avatar';
            avatar.textContent = 'AI';
            
            const dots = document.createElement('div');
            dots.className = 'text-bubble ai-bubble typing-indicator';
            dots.innerHTML = `
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            `;
            
            typingDiv.appendChild(avatar);
            typingDiv.appendChild(dots);
            chatArea.appendChild(typingDiv);
            
            // Scroll to bottom
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        // Remove typing indicator
        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }
        
        // Get AI response
        async function getAIResponse(userMessage) {
            // Simulate API delay
            await new Promise(resolve => setTimeout(resolve, 800 + Math.random() * 800));
            
            // Smart responses based on user input
            const lowerMsg = userMessage.toLowerCase();
            
            if (lowerMsg.includes('hello') || lowerMsg.includes('hi') || lowerMsg.includes('hey')) {
                return "Hello! 👋 I'm ChatGPT, an AI assistant created by OpenAI. How can I help you today?";
            }
            
            if (lowerMsg.includes('name')) {
                return "I'm ChatGPT, which stands for 'Chat Generative Pre-trained Transformer'. I'm an AI language model developed by OpenAI.";
            }
            
            if (lowerMsg.includes('who are you') || lowerMsg.includes('what are you')) {
                return "I'm an AI assistant based on the GPT architecture. I can understand and generate human-like text, answer questions, help with writing, coding, and much more!";
            }
            
            if (lowerMsg.includes('ai') || lowerMsg.includes('artificial intelligence')) {
                return "AI (Artificial Intelligence) refers to machines or software that exhibit human-like intelligence. This includes learning, reasoning, problem-solving, and understanding natural language.";
            }
            
            if (lowerMsg.includes('computer')) {
                return "A computer is an electronic device that processes data according to instructions (programs). Modern computers can perform millions of calculations per second and run complex software.";
            }
            
            if (lowerMsg.includes('how are you') || lowerMsg.includes('how do you feel')) {
                return "As an AI, I don't have feelings, but I'm functioning perfectly and ready to help you with anything you need! 😊";
            }
            
            if (lowerMsg.includes('thank')) {
                return "You're welcome! 😊 Is there anything else I can help you with today?";
            }
            
            if (lowerMsg.includes('bye') || lowerMsg.includes('goodbye')) {
                return "Goodbye! Feel free to return anytime if you have more questions. Have a great day! 👋";
            }
            
            if (lowerMsg.includes('love') || lowerMsg.includes('like you')) {
                return "I appreciate that! As an AI, I'm here to assist and provide helpful responses. How else can I help you today?";
            }
            
            if (lowerMsg.includes('joke') || lowerMsg.includes('funny')) {
                const jokes = [
                    "Why don't scientists trust atoms? Because they make up everything!",
                    "Why did the computer go to the doctor? It had a virus!",
                    "What do you call a fake noodle? An impasta!",
                    "Why was the math book sad? It had too many problems."
                ];
                return jokes[Math.floor(Math.random() * jokes.length)];
            }
            
            // Default intelligent responses
            const responses = [
                "That's an interesting question! Let me provide you with some information about that.",
                "I understand what you're asking. Here's what I know about that topic:",
                "Great question! Based on my knowledge, here's the information you're looking for.",
                "I'd be happy to help with that. Here's what I can tell you:",
                "Thanks for your question! This is an important topic. Here's my response:",
                "I've analyzed your question and here's the most accurate information I can provide:",
                "That's a thoughtful question. Let me share some insights on that subject."
            ];
            
            return responses[Math.floor(Math.random() * responses.length)] + " If you need more details, feel free to ask!";
        }
        
        // Send message function
        async function sendMessage() {
            const message = messageInput.value.trim();
            
            // Validation
            if (!message || isProcessing) return;
            
            // Disable input during processing
            isProcessing = true;
            messageInput.disabled = true;
            sendButton.disabled = true;
            
            // Add user message
            displayMessage('user', message);
            
            // Clear input
            messageInput.value = '';
            
            // Show typing indicator
            showTypingIndicator();
            
            try {
                // Get AI response
                const aiResponse = await getAIResponse(message);
                
                // Remove typing indicator
                removeTypingIndicator();
                
                // Add AI response
                displayMessage('ai', aiResponse);
                
            } catch (error) {
                removeTypingIndicator();
                displayMessage('ai', "Sorry, I encountered an error. Please try again.");
            } finally {
                // Re-enable input
                isProcessing = false;
                messageInput.disabled = false;
                sendButton.disabled = false;
                
                // Focus input
                setTimeout(() => {
                    messageInput.focus();
                }, 100);
            }
        }
        
        // Event Listeners
        sendButton.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // Auto-resize input (for multi-line if enabled later)
        messageInput.addEventListener('input', function() {
            if (this.value.includes('\n')) {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            }
        });
        
        // Clear chat function (optional)
        window.clearChat = function() {
            if (confirm("Clear all chat history?")) {
                chatArea.innerHTML = '';
                chatHistory = [];
                localStorage.removeItem('chatHistory');
                setTimeout(() => {
                    displayMessage('ai', "Chat cleared! How can I help you today?");
                }, 500);
            }
        };
    </script>
</body>
</html>
